services:
  nginx-web:
    image: nginx:latest
    container_name: agent-start-web
    hostname: web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./volumes/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./volumes/nginx/conf.d:/etc/nginx/conf.d
      - ./agent-start-web/dist:/etc/nginx/html
      - ./volumes/nginx/conf/cert:/etc/nginx/cert
      - ./volumes/nginx/logs:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai
    networks:
      - agent_start
  redis:
    image: redis:6-alpine
    container_name: agent-start-redis
    hostname: redis
    restart: always
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis_cool}
    volumes:
      - ./volumes/redis/data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_cool}
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
    networks:
      - agent_start
  mysql:
    image: mysql:8.4
    container_name: agent-start-mysql
    hostname: mysql
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql
      - ./volumes/mysql/conf:/etc/mysql/conf.d
      - ./volumes/mysql/log:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql@cool
      TZ: Asia/Shanghai
    networks:
      - agent_start
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
  rabbitmq:
    image: rabbitmq:management
    container_name: agent-start-rabbitmq
    hostname: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-admin@rabbit}
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - agent_start
  nacos:
    image: nacos/nacos-server:v3.1.0
    container_name: agent-start-nacos
    hostname: nacos
    restart: always
    ports:
      - "8880:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./volumes/nacos/conf/application.properties:/home/nacos/conf/application.properties
      - ./volumes/nacos/logs:/home/nacos/logs
      - ./volumes/nacos/data:/home/nacos/data
    environment:
      - MODE=standalone
      - TZ=Asia/Shanghai
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=nacos-auth-key-2025
      - NACOS_AUTH_IDENTITY_VALUE=nacos-auth-val-8f7d2b9c
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - agent_start
  minio:
    container_name: agent-start-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    hostname: minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live' ]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9001:9001"
      - "9002:9000"
    networks:
      - agent_start
  etcd:
    container_name: agent-start-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - agent_start
  milvus:
    container_name: agent-start-milvus
    image: milvusdb/milvus:v2.6.5
    hostname: milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_BUCKET_NAME: milvus
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: false
      LOG_LEVEL: debug
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
    networks:
      - agent_start
  elasticsearch:
    image: elasticsearch:9.0.2
    container_name: agent-start-elasticsearch
    hostname: elasticsearch
    restart: always
    environment:
      - node.name=elasticsearch
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./volumes/elasticsearch/data:/usr/share/elasticsearch/data
      - ./volumes/elasticsearch/config/certs:/usr/share/config/certs
      - ./volumes/elasticsearch/config/elasticsearch.keystore:/usr/share/elasticsearch/config/elasticsearch.keystore
      - ./volumes/elasticsearch/plugins/ik:/usr/share/elasticsearch/plugins/ik
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: curl -f http://localhost:9200 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - agent_start

  kibana:
    image: kibana:9.0.2
    container_name: agent-start-kibana
    hostname: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack_fleet_isairgapped=true
      - i18n_locale=zh-CN
      - server_port=5601
      - ELASTICSEARCH_USERNAME=kibana
      - ELASTICSEARCH_PASSWORD=kibanapassword123
    depends_on:
      - elasticsearch
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -s http://localhost:5601 >/dev/null || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent_start
networks:
  agent_start:
    driver: bridge