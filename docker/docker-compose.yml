services:
  nginx-web:
    image: nginx:latest
    container_name: agent-start-web
    hostname: web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./volumes/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./volumes/nginx/conf.d:/etc/nginx/conf.d
      - ./agent-start-web/dist:/etc/nginx/html
      - ./volumes/nginx/conf/cert:/etc/nginx/cert
      - ./volumes/nginx/logs:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai
    networks:
      - agent_start
  redis:
    image: redis:6-alpine
    container_name: agent-start-redis
    hostname: redis
    restart: always
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis_cool}
    volumes:
      - ./volumes/redis/data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_cool}
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
    networks:
      - agent_start
  mysql:
    image: mysql:8.4
    container_name: agent-start-mysql
    hostname: mysql
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql
      - ./volumes/mysql/conf:/etc/mysql/conf.d
      - ./volumes/mysql/log:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql@cool
      TZ: Asia/Shanghai
    networks:
      - agent_start
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
  rabbitmq:
    image: rabbitmq:management
    container_name: agent-start-rabbitmq
    hostname: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-admin@rabbit}
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - agent_start
  nacos:
    image: nacos/nacos-server:v3.1.0
    container_name: agent-start-nacos
    hostname: nacos
    restart: always
    ports:
      - "8880:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./volumes/nacos/conf/application.properties:/home/nacos/conf/application.properties
      - ./volumes/nacos/logs:/home/nacos/logs
      - ./volumes/nacos/data:/home/nacos/data
    environment:
      - MODE=standalone
      - TZ=Asia/Shanghai
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=nacos-auth-key-2025
      - NACOS_AUTH_IDENTITY_VALUE=nacos-auth-val-8f7d2b9c
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - agent_start
  minio:
    container_name: agent-start-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    hostname: minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live' ]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9001:9001"
      - "9002:9000"
    networks:
      - agent_start
networks:
  agent_start:
    driver: bridge