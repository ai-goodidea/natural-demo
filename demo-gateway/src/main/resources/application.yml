server:
  port: 7001

spring:
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_cool}
      timeout: 3000ms
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-route
          uri: lb://boot-user
          predicates:
            - Path=/user/**
        - id: supplier-route
          uri: lb://boot-supplier
          predicates:
            - Path=/supplier/**
        - id: business-route
          uri: lb://boot-business
          predicates:
            - Path=/business/**
        - id: ai-route
          uri: lb://boot-ai
          predicates:
            - Path=/ai/**

auth:
  jwt:
    secret: ${JWT_SECRET:natural-demo-jwt-secret-key-please-replace-me-32+chars}
    ttl-seconds: 86400
  whitelist:
    # 白名单：登录、健康检查、AI 流式（演示用）
    - /user/auth/login
    - /actuator/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
