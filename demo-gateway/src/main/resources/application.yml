server:
  port: 7001

spring:
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_cool}
      timeout: 3000ms
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-route
          uri: lb://boot-user
          predicates:
            - Path=/user/**
        - id: supplier-route
          uri: lb://boot-supplier
          predicates:
            - Path=/supplier/**
        - id: business-route
          uri: lb://boot-business
          predicates:
            - Path=/business/**
        - id: ai-route
          uri: lb://boot-ai
          predicates:
            - Path=/ai/**

auth:
  jwt:
    secret: ${JWT_SECRET:natural-demo-jwt-secret-key-please-replace-me-32+chars}
    ttl-seconds: 86400
  whitelist:
    # 白名单：登录、健康检查、Swagger 聚合（演示用）
    - /user/auth/login
    - /actuator/**
    - /v3/api-docs/**
    - /*/v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /webjars/**
    - /doc.html

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 聚合下游服务的 OpenAPI 文档，前端 swagger-ui 顶部下拉切换
    urls:
      - name: boot-user
        url: /user/v3/api-docs
      - name: boot-supplier
        url: /supplier/v3/api-docs
      - name: boot-business
        url: /business/v3/api-docs
      - name: boot-ai
        url: /ai/v3/api-docs
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
